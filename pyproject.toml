[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
explicit_package_bases = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = "part1.experiment"
disable_error_code = ["var-annotated"]
# Preserve the exact pre-execution LR script hash; its empty CV-member accumulator is populated immediately.
